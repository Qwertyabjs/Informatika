<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piket</title>


<style>
:root {
  --primary: #1486e2;
  --dark: #0f172a;
  --bg: #ffffff;
  --white: #fdf5f5;
  --green: #00ff37;
}


* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #023dff;
}


header {
  background: var(--dark);
  color: rgb(255, 0, 0);
  padding: 22px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}


.logo {
  font-size: 27px;
  font-weight: bold;
}


.logo span {
  color: #ffffff;
}


header p {
  font-size: 13px;
  margin-top: 5px;
  color: #e1cbcb;
}


.container {
  max-width: 1050px;
  margin: 28px auto;
  padding: 0 18px;
}


.welcome {
  margin-bottom: 22px;
}


.welcome h1 {
  font-size: 27px;
  margin-bottom: 8px;
}


.welcome p {
  color: #64748b;
  line-height: 1.5;
}


.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 24px;
}


.stat, .panel {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #0f172a0b;
}


.stat p {
  color: #000000;
  font-size: 14px;
}


.stat h2 {
  margin-top: 12px;
  font-size: 28px;
}


.panel {
  margin-bottom: 20px;
}


.panel h2 {
  font-size: 19px;
  margin-bottom: 15px;
}


.notice {
  background: #0f172a;
  color: #ffffff;
  border-left: 5px solid var(--primary);
  border-radius: 8px;
  padding: 16px;
  line-height: 1.6;
  margin-bottom: 20px;
}


.task-list {
  display: grid;
  gap: 10px;
}


.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid #00ccff;
  border-radius: 10px;
}


.task input {
  width: 19px;
  height: 19px;
  cursor: pointer;
}


.task label {
  flex: 1;
  cursor: pointer;
  line-height: 1.4;
}


.task small {
  display: block;
  color: #64748b;
  margin-top: 4px;
}


.task.done {
  background: #01ffea6c;
}


.task.done label {
  text-decoration: line-through;
  color: #ffffff;
}


button {
  background: var(--primary);
  color: rgb(0, 0, 0);
  border: none;
  padding: 11px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}


button:hover {
  opacity: 0.88;
}


button.secondary {
  background: #e2e8f0;
  color: #1e293b;
}


button.danger {
  background: #ffa600;
}


.actions {
  display: flex;
  flex-wrap: wrap; 
  gap: 10px;
  margin-top: 16px;
}


input[type="text"], input[type="time"],
input[type="date"], select {
  padding: 11px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  width: 100%;
  margin-top: 7px;
  font-size: 14px;
}


.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
}


.field {
  margin-bottom: 13px;
}


.field label {
  font-size: 14px;
  font-weight: bold;
}


.status {
  margin-top: 12px;
  font-size: 14px;
  color: #64748b;
  line-height: 1.6;
}


footer {
  text-align: center;
  padding: 25px;
  color: #64748b;
  font-size: 13px;
}


@media (max-width: 600px) {
  .stats {
    grid-template-columns: 1fr;
  }


  .form-grid {
    grid-template-columns: 1fr;
  }


  .welcome h1 {
    font-size: 23px;
  }
}
</style>
</head>

<header>
  <div>
